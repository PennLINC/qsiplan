# A single DWI series with no fieldmap of any kind, but the subject has a
# T1w and a T2w. Expected by default: an INFERRED SyNb0 + TOPUP estimation from
# the T1w (the T2w does not bring unpile in). With sdc_anat_reference='none': no
# correction. With --sdc-fieldmapless-method unpile and sdc_anat_reference='t2w':
# a unpile estimation corrects it instead.
'01':
  - anat:
      - suffix: T1w
      - suffix: T2w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
