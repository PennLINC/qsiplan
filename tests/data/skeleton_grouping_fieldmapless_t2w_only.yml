# A single DWI series with no fieldmap and only a T2w (no T1w). Expected by
# default: an error, since the default SyNb0 + TOPUP needs a T1w (the message
# points to --sdc-anat-reference none). With --sdc-fieldmapless-method unpile
# and sdc_anat_reference='t2w': a unpile estimation, which the tortoise preview
# states and the fsl preview refuses.
'01':
  - anat:
      - suffix: T2w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
