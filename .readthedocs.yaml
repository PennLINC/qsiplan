version: 2

build:
  os: ubuntu-22.04
  tools:
    python: '3.11'
  jobs:
    post_checkout:
      # hatch-vcs derives the version from tags; RTD clones shallowly.
      - git fetch --unshallow || true
      - git fetch --tags || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
